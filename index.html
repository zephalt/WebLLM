<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebLLM Chat</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --card:#f3f3f1; --line:#ddd; --me:#2b5fd9; --mefg:#fff;
          --r:10px; --rl:15px; --w:760px; --gap:10px; --font:system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.5; display:flex; flex-direction:column; max-width:var(--w); margin:0 auto; padding:12px; }
  select,button,textarea,input[type=number],input[type=search] { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:8px 10px; }
  button { cursor:pointer; } button:disabled { opacity:.5; cursor:default; }
  button.primary, #nav button.active, #tabs button.active { background:var(--me); color:var(--mefg); border-color:var(--me); }
  #nav { display:flex; gap:6px; margin-bottom:8px; } #nav button { flex:1; }
  #status { color:var(--muted); font-size:13px; margin:4px 0; min-height:20px; }
  #bar { height:4px; background:var(--card); border-radius:var(--r); overflow:hidden; display:none; margin-bottom:6px; }
  #bar div { height:100%; width:0; background:var(--me); transition:width .2s; }
  .view { display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; gap:8px; }
  .view.active { display:flex; } #v-chat { overflow:hidden; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border-radius:var(--rl); padding:12px; display:flex; flex-direction:column; gap:10px; }
  .card h3 { margin:0; font-size:15px; }
  .card label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
  .card label.inline { flex-direction:row; align-items:center; gap:8px; }
  .card select,.card textarea,.card input[type=number] { background:var(--bg); width:100%; }
  .card input[type=checkbox] { width:auto; }
  #themegrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:8px; }
  #themegrid button { padding:10px 6px; font-size:13px; border-width:2px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  #themegrid i { width:16px; height:16px; border-radius:50%; display:block; }
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:var(--gap); padding:8px 0; }
  .msg { padding:10px 14px; border-radius:var(--rl); max-width:85%; white-space:pre-wrap; word-wrap:break-word; background:var(--card); }
  .msg.user { align-self:flex-end; background:var(--me); color:var(--mefg); }
  :root[data-bubble="outline"] .msg { background:transparent; border:1px solid var(--line); }
  :root[data-bubble="outline"] .msg.user { border-color:var(--me); color:var(--fg); }
  :root[data-bubble="flat"] .msg { background:transparent; padding-left:0; padding-right:0; max-width:100%; }
  :root[data-bubble="flat"] .msg.user { color:var(--fg); font-weight:600; align-self:flex-start; }
  .msg pre { position:relative; background:rgba(128,128,128,.2); padding:8px; border-radius:var(--r); overflow-x:auto; margin:6px 0; }
  .msg code { font-family:monospace; } .cp { position:absolute; top:4px; right:4px; font-size:12px; padding:2px 6px; }
  form { display:flex; gap:8px; } textarea { flex:1; resize:none; height:46px; }
  #cachebox { display:none; font-size:13px; background:var(--card); border-radius:var(--rl); padding:10px; }
  .acts { display:flex; gap:6px; margin-top:6px; opacity:.65; } .acts button { font-size:11px; padding:1px 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:auto 0; justify-content:center; }
  progress { width:100%; height:6px; accent-color:var(--me); }
  /* gradients */
  body { background: var(--grad-bg); }
  #nav { background: var(--grad-nav); border-radius: var(--rl); padding: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  #nav button { border: none; background: transparent; color: var(--fg); opacity: .7; }
  #nav button.active { background: var(--me); color: var(--mefg); opacity: 1; box-shadow: 0 2px 8px color-mix(in srgb, var(--me) 40%, transparent); }
  .card { box-shadow: 0 1px 4px rgba(0,0,0,.1); background: color-mix(in srgb, var(--card) 90%, var(--bg) 10%); }
  .msg { box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  .msg.user { background: var(--grad-me); }
  button.primary { background: var(--grad-me); border: none; box-shadow: 0 2px 8px color-mix(in srgb, var(--me) 35%, transparent); }
  #bar div { background: var(--grad-me); }
  progress { height: 4px; border-radius: 4px; }
  progress::-webkit-progress-value { background: var(--grad-me); border-radius: 4px; }
  progress::-webkit-progress-bar { background: var(--card); border-radius: 4px; }
  #status { background: var(--card); border-radius: var(--r); padding: 4px 10px; font-size: 13px; }
  .toolbar select, .toolbar input[type=search] { background: color-mix(in srgb, var(--card) 80%, var(--bg) 20%); }
</style>
</head>
<body>
<nav id="nav"><button data-view="chat" class="active">Chat</button><button data-view="models">Models</button><button data-view="settings">Settings</button></nav>
<div id="status">Open the Models page, pick a model, and load it. It downloads once, then is cached.</div>
<div id="bar"><div></div></div>

<section id="v-chat" class="view active">
  <div class="toolbar">
    <select id="chats" class="grow"></select>
    <button id="newchat">New</button><button id="rename">Rename</button><button id="clear">Clear</button><button id="delchat">Delete</button><button id="export">Export</button>
  </div>
  <div class="toolbar"><input type="search" id="csearch" class="grow" placeholder="Search chats..."><select id="persona" title="Persona (system prompt)"></select></div>
  <div class="muted"><span id="curtxt">No model loaded.</span> <button id="gomodels">Choose a model</button></div>
  <div id="chat"></div>
  <div id="fchip" class="muted" style="display:none;cursor:pointer"></div>
  <div class="toolbar"><button id="regen">Regenerate</button><button id="edit">Edit last</button><button id="stop" style="display:none">Stop</button></div>
  <form id="form">
    <button id="attach" type="button" title="Attach a text file">📎</button>
    <textarea id="input" placeholder="Load a model first..." disabled></textarea>
    <button id="send" class="primary" disabled>Send</button>
  </form>
  <div id="meter" class="muted"></div><progress id="meterbar" max="1" value="0"></progress>
  <input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.js,.py,.html,.css,.log,.xml,.yml,.yaml,text/*">
</section>

<section id="v-models" class="view">
  <div id="tabs" class="toolbar"><button data-tab="webllm">WebLLM</button><button data-tab="tjs">Transformers.js</button><button data-tab="wllama">wllama</button></div>
  <div class="toolbar"><select id="model" class="grow"></select><button id="star" title="Favorite this model">☆</button><button id="load" class="primary">Load model</button></div>
  <div class="toolbar">
    <select id="sort"><option value="desc">Biggest to smallest (by GB)</option><option value="asc">Smallest to biggest (by GB)</option><option value="az">A to Z</option></select>
    <select id="fam"><option value="All">All families</option></select>
    <label class="muted"><input type="checkbox" id="onlyfav"> ★ only</label><span id="count" class="muted"></span>
  </div>
  <div id="src" class="muted"></div>
  <div class="toolbar"><button id="cache">Manage downloads</button></div>
  <div id="cachebox"></div>
</section>

<section id="v-settings" class="view">
  <div class="card"><h3>Chat</h3>
    <label>System prompt<textarea id="sys" style="height:80px"></textarea></label>
    <div class="toolbar"><button id="psave">Save as preset</button><button id="pdel">Delete preset</button></div>
    <label>Temperature (creativity)<input type="range" id="temp" min="0" max="1.5" step="0.1"></label>
    <label>Max reply tokens (0 = no limit)<input type="number" id="max" min="0" max="131072"></label>
    <label>Context size in tokens (0 = no limit). Set a number if a small model gets confused or runs out of memory<input type="number" id="ctx" min="0" max="131072" step="256"></label>
    <label class="inline"><input type="checkbox" id="trim"> Leave out the oldest messages automatically when the chat gets too long</label>
    <label class="inline"><input type="checkbox" id="auto"> Auto-load the last WebLLM model if it's already downloaded</label>
  </div>
  <div class="card"><h3>Appearance</h3>
    <label>Theme</label><div id="themegrid"></div>
    <div class="toolbar"><label class="inline">Accent color <input type="color" id="accent"></label><button id="accentreset">Use theme color</button></div>
    <label>Corner roundness<input type="range" id="radius" min="0" max="28"></label>
    <label>Font size<input type="range" id="font" min="12" max="22"></label>
    <label>Font<select id="fontfam"><option value="system">System</option><option value="serif">Serif</option><option value="mono">Monospace</option><option value="rounded">Rounded</option></select></label>
    <label>Page width<input type="range" id="width" min="560" max="1100" step="20"></label>
    <label>Message spacing<select id="density"><option value="compact">Compact</option><option value="cozy">Cozy</option><option value="roomy">Roomy</option></select></label>
    <div class="toolbar"><select id="looksel" class="grow"></select><button id="looksave">Save current look</button><button id="lookdel">Delete</button></div>
    <label>Message style<select id="bubble"><option value="filled">Filled bubbles</option><option value="outline">Outlined</option><option value="flat">Flat (no bubbles)</option></select></label>
  </div>
  <div class="card"><h3>Data</h3>
    <div class="muted">Chats and settings are stored in this browser only.</div>
    <div class="toolbar"><button id="backup">Back up everything</button><button id="restore">Restore from file</button><button id="resetS">Reset settings</button><button id="wipe">Delete all chats</button></div>
    <input type="file" id="restorefile" hidden accept=".json,application/json">
    <div class="muted">Shortcuts: Enter sends, Shift+Enter adds a line, Ctrl+K starts a new chat, Esc stops a reply.</div>
  </div>
</section>

<script type="module">

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), status = $("status");
const bar = $("bar"), barFill = bar.firstElementChild;
let runner = null, busy = false;
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const S = Object.assign({ sys: "You are a helpful, concise assistant.", temp: 0.7, max: 0, font: 15, theme: "auto", ctx: 0, trim: true, personas: {}, looks: {}, sort: "desc", fam: "All", radius: 10, accent: "", width: 760, fontfam: "system", density: "cozy", bubble: "filled", auto: false, last: "", favs: [], onlyfav: false }, LS.get("wl_set", {}));
const saveS = () => LS.set("wl_set", S);
if (S.v !== 2) { S.v = 2; S.ctx = 0; S.max = 0; saveS(); } // limits are off by default
let history = [];


let CreateMLCEngine, prebuiltAppConfig, hasModelInCache, deleteModelAllInfoInCache;
for (const url of ["https://esm.run/@mlc-ai/web-llm", "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm", "https://esm.sh/@mlc-ai/web-llm", "https://unpkg.com/@mlc-ai/web-llm?module", "https://cdn.skypack.dev/@mlc-ai/web-llm"]) {
  try { ({ CreateMLCEngine, prebuiltAppConfig, hasModelInCache, deleteModelAllInfoInCache } = await import(url)); break; }
  catch (e) { console.error("Library load failed:", url, e); }
}
if (!CreateMLCEngine) {
  status.textContent = /^https?:$/.test(location.protocol)
    ? "Couldn't load the WebLLM library (offline, or esm.run / jsdelivr is blocked by an extension or network)."
    : "This page was opened from a local file (" + location.protocol + "), and the browser blocks the library from loading there. Host the file at an https:// address (GitHub Pages or Netlify Drop) and open it from there.";
}

const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function md(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, l, c) => `<pre><button class="cp" type="button">Copy</button><code>${c}</code></pre>`);
  return h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function setMsg(d, text) { d.querySelector(".mt").innerHTML = md(text); }
function addMsg(role, text, i) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.dataset.i = i == null ? "" : i;
  d.innerHTML = '<div class="mt"></div><div class="acts"><button data-a="copy" type="button">Copy</button><button data-a="del" type="button">Delete</button></div>';
  setMsg(d, text); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d;
}
chat.addEventListener("click", e => {
  if (!e.target.classList.contains("cp")) return;
  navigator.clipboard.writeText(e.target.nextElementSibling.textContent);
  e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1200);
});

// ---- Model list: built-ins + experimental extras, with sort and family filter ----
const FAMILIES = [
  ["TinyLlama", ["tinyllama"]], ["DeepSeek", ["deepseek"]], ["Hermes", ["hermes"]],
  ["Qwen", ["qwen"]], ["Llama", ["llama"]], ["Gemma", ["gemma"]], ["Phi", ["phi-", "phi3", "phi_"]],
  ["SmolLM", ["smollm"]], ["Mistral", ["mistral", "ministral"]], ["StableLM", ["stablelm"]]
];
const familyOf = id => {
  const s = id.toLowerCase();
  for (const [name, keys] of FAMILIES) if (keys.some(k => s.includes(k))) return name;
  return "Other";
};
const paramsOf = (id, vram) => {
  const m = id.replace(/(\d)_(\d+[bBmM])/, "$1.$2").match(/(?<![\d.])(\d+(?:\.\d+)?)\s*([BM])(?![a-zA-Z])/i);
  if (m) return parseFloat(m[1]) * (m[2].toUpperCase() === "B" ? 1 : 0.001);
  return (vram || 0) / 600; // rough guess when the name has no size
};
const fmtParams = p => p >= 1 ? (Number.isInteger(p) ? p : p.toFixed(1)) + "B" : Math.round(p * 1000) + "M";

const base = (prebuiltAppConfig ? prebuiltAppConfig.model_list : [])
  .filter(m => m.model_type !== 1 && (m.vram_required_MB || 0) < 8192) // 1 = embedding models, which can't chat
  .sort((a, b) => (a.vram_required_MB || 0) - (b.vram_required_MB || 0));
const all = base.map(m => ({
  id: m.model_id, family: familyOf(m.model_id), vram: m.vram_required_MB || 0,
  params: paramsOf(m.model_id, m.vram_required_MB), vision: m.model_type === 2, extra: false, tag: "", src: m.model
}));

// Extra models that aren't in WebLLM's built-in list. These are guesses: each reuses the engine
// file of a similar built-in model (or its own), and many will fail to load. They're tagged [experimental].
const EXTRAS = [
  { id: "Qwen2-0.5B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-0.5B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-0.5B-Instruct-q4f16_1"] },
  { id: "Qwen2-1.5B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-1.5B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-1.5B-Instruct-q4f16_1"] },
  { id: "Qwen2-7B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-7B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-7B-Instruct-q4f16_1"] },
  { id: "Qwen2.5-14B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2.5-14B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-7B-Instruct-q4f16_1"] },
  { id: "Qwen3.5-0.8B-q4f16_1-MLC", repo: "emb1ter/Qwen3.5-0.8B-q4f16_1-MLC", tpl: ["Qwen3-0.6B-q4f16_1"] },
  { id: "Qwen3.5-4B-q4f16_1-ctx8k_cs1k-MLC", repo: "emb1ter/Qwen3.5-4B-q4f16_1-ctx8k_cs1k-MLC", tpl: ["Qwen3-4B-q4f16_1"] },
  { id: "Qwen3.5-27B-q4f16_1-MLC", repo: "emb1ter/Qwen3.5-27B-q4f16_1-MLC", tpl: ["Qwen3-8B-q4f16_1"] },
  { id: "CodeLlama-7b-Instruct-hf-q4f16_1-MLC", repo: "mlc-ai/CodeLlama-7b-Instruct-hf-q4f16_1-MLC", tpl: ["Llama-2-7b-chat-hf-q4f16_1", "Llama-3.1-8B-Instruct-q4f16_1"] },
  { id: "CodeLlama-13b-Instruct-hf-q4f16_1-MLC", repo: "mlc-ai/CodeLlama-13b-Instruct-hf-q4f16_1-MLC", tpl: ["Llama-2-13b-chat-hf-q4f16_1", "Llama-3.1-8B-Instruct-q4f16_1"] },
  { id: "gemma-2-27b-it-q4f16_1-MLC", repo: "mlc-ai/gemma-2-27b-it-q4f16_1-MLC", tpl: ["gemma-2-9b-it-q4f16_1"] },
  { id: "EuroLLM-9B-Instruct-2512-q4f16_1-MLC", repo: "dstefl/EuroLLM-9B-Instruct-2512-q4f16_1-MLC",
    lib: "https://huggingface.co/dstefl/EuroLLM-9B-Instruct-2512-q4f16_1-MLC/resolve/main/EuroLLM-9B-Instruct-2512-q4f16_1-MLC-webgpu.wasm" }
];
function addExtra(x, tplModel) {
  const vram = Math.round(paramsOf(x.id) * 600 + 500);
  if (vram >= 8192) return; // skip anything 8 GB or larger
  prebuiltAppConfig.model_list.push({
    model: "https://huggingface.co/" + x.repo, model_id: x.id,
    model_lib: x.lib || tplModel.model_lib, vram_required_MB: vram,
    low_resource_required: false, overrides: tplModel ? tplModel.overrides : undefined
  });
  all.push({ id: x.id, family: familyOf(x.id), vram, params: paramsOf(x.id, vram), vision: false, extra: true, tag: "experimental", src: "https://huggingface.co/" + x.repo });
}
for (const x of (prebuiltAppConfig ? EXTRAS : [])) {
  if (all.some(e => e.id === x.id)) continue; // already built in
  let t = null;
  for (const k of x.tpl || []) { t = base.find(m => m.model_id.includes(k)); if (t) break; }
  if (t || x.lib) addExtra(x, t);
}

function buildFamilies() {
  const prev = famWanted, counts = {};
  LISTS[tab].forEach(e => counts[e.family] = (counts[e.family] || 0) + 1);
  $("fam").innerHTML = `<option value="All">All families (${LISTS[tab].length})</option>` +
    Object.keys(counts).sort().map(f => `<option value="${f}">${f} (${counts[f]})</option>`).join("");
  $("fam").value = counts[prev] ? prev : "All";
}
function render(keep) {
  const prev = keep || $("model").value, fam = $("fam").value, order = $("sort").value;
  const list = LISTS[tab].filter(e => (fam === "All" || e.family === fam) && (!S.onlyfav || S.favs.includes(e.id)));
  const size = e => e.vram || e.params * 600; // the GB shown in the list
  list.sort((a, b) => order === "az" ? a.id.localeCompare(b.id)
    : (order === "asc" ? size(a) - size(b) : size(b) - size(a)) || (order === "asc" ? a.params - b.params : b.params - a.params) || a.id.localeCompare(b.id));
  $("model").innerHTML = "";
  for (const e of list) {
    const o = document.createElement("option");
    o.value = e.id;
    o.textContent = `${S.favs.includes(e.id) ? "★ " : ""}${e.id.replace("-MLC", "")} (~${fmtParams(e.params)}, ~${(e.vram / 1024).toFixed(1)} GB)` +
      (e.tag ? " [" + e.tag + "]" : "") + (e.vision ? " [vision, text chat only here]" : "");
    $("model").appendChild(o);
  }
  if (list.some(e => e.id === prev)) $("model").value = prev;
  $("count").textContent = list.length + " models"; updateSrc();
  $("star").textContent = S.favs.includes($("model").value) ? "★" : "☆";
}
// ---- Engines and their model lists ----
// Transformers.js and wllama lists are untested guesses at real Hugging Face repos. All are under 8 GB.
const mk = (id, repo, gb, file) => ({
  id, family: familyOf(id), vram: Math.round(gb * 1024), params: paramsOf(id, gb * 1024), vision: false,
  extra: true, tag: "untested", repo, file, src: "https://huggingface.co/" + repo + (file ? " (file: " + file + ")" : "")
});
const TJS = [
  ["onnx-community/SmolLM2-135M-Instruct", .2], ["onnx-community/SmolLM2-360M-Instruct", .4], ["onnx-community/SmolLM2-1.7B-Instruct", 1.3],
  ["onnx-community/gemma-3-270m-it-ONNX", .4], ["onnx-community/gemma-3-1b-it-ONNX", 1], ["onnx-community/Qwen2.5-0.5B-Instruct", .6],
  ["onnx-community/Qwen2.5-1.5B-Instruct", 1.4], ["onnx-community/Qwen2.5-Coder-0.5B-Instruct", .6], ["onnx-community/Qwen2.5-Coder-1.5B-Instruct", 1.4],
  ["onnx-community/Qwen3-0.6B-ONNX", .7], ["onnx-community/Qwen3-1.7B-ONNX", 1.5], ["onnx-community/Qwen3-4B-ONNX", 2.9],
  ["onnx-community/Llama-3.2-1B-Instruct", 1.1], ["onnx-community/Llama-3.2-3B-Instruct", 2.5],
  ["onnx-community/Phi-3.5-mini-instruct-onnx-web", 2.6], ["onnx-community/TinyLlama-1.1B-Chat-v1.0-ONNX", 1],
  ["onnx-community/DeepSeek-R1-Distill-Qwen-1.5B-ONNX", 1.4]
].map(([repo, gb]) => mk(repo, repo, gb));
const WL = [

async function webllmCache() {

  const rows = [];

async function tjsCache() {
  if (!window.caches) return { rows: [], note: "The browser's Cache API isn't available here." };
  const c = await caches.open("transformers-cache"), reqs = await c.keys(), byRepo = {};
  for (const r of reqs) {
    const m = new URL(r.url).pathname.match(/^\/([^/]+\/[^/]+)\//), k = m ? m[1] : r.url;
    (byRepo[k] = byRepo[k] || []).push(r);

    let size = 0;
    for (const r of list) { const res = await c.match(r); size += (res && +res.headers.get("content-length")) || 0; }
    rows.push({ label: k, size, del: async () => { for (const r of list) await c.delete(r); } });

    const list = await inst.cacheManager.list();

    const root = "https://cdn.jsdelivr.net/npm/@wllama/wllama@2/esm/";
    const w = new W.Wllama({ "single-thread/wllama.wasm": root + "single-thread/wllama.wasm", "multi-thread/wllama.wasm": root + "multi-thread/wllama.wasm" });
    await w.loadModelFromUrl(`https://huggingface.co/${entry.repo}/resolve/main/${entry.file}`, {
      n_ctx: S.ctx || 8192, progressCallback: ({ loaded, total }) => onProgress("Downloading " + entry.file, total ? loaded / total : 0)
    });
    let halt = false;
    return {
      async chat(msgs, o, onTok) {
        halt = false; let prev = "";
        await w.createChatCompletion(msgs, { nPredict: o.max_tokens || -1, sampling: { temp: o.temperature },
          onNewToken: (t, piece, text, opt) => { onTok(text.slice(prev.length)); prev = text; if (halt) opt.abortSignal(); } });
      },
      stop() { halt = true; }, reset() {}
    };
  }
};

// ---- tabs ----
function setTab(t) {
  tab = t; S.tab = t; saveS();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  buildFamilies();
  render(S.lastTab === t && S.last ? S.last : t === "webllm" ? "SmolLM2-360M-Instruct-q4f16_1-MLC" : "");
  $("load").disabled = t === "webllm" && (!CreateMLCEngine || !navigator.gpu);
  if (t === "webllm" && !CreateMLCEngine) status.textContent = "Couldn't load the WebLLM library. Try the other tabs, or see the console.";
  else if (t === "webllm" && !navigator.gpu) status.textContent = "WebGPU isn't available here, so WebLLM can't run. Try the Transformers.js or wllama tab.";
  else if (t === "tjs" && !navigator.gpu) status.textContent = "No WebGPU detected. Transformers.js will run on the CPU (slower).";
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { if (!busy && !$("model").disabled) setTab(b.dataset.tab); });
setTab(tab);
if (S.auto && S.last && (S.lastTab || "webllm") === "webllm" && tab === "webllm" && hasModelInCache && all.some(e => e.id === S.last)) {
  hasModelInCache(S.last, CFG()).then(ok => { if (ok) $("load").click(); }).catch(() => {});
}

// ---- pages ----
function showView(v) {
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("active", el.id === "v-" + v));
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => showView(b.dataset.view));
$("gomodels").onclick = () => showView("models");
$("resetS").onclick = () => { if (confirm("Reset all settings to their defaults?")) { try { localStorage.removeItem("wl_set"); } catch {} location.reload(); } };
$("wipe").onclick = () => { if (confirm("Delete all saved chats?")) { chats = {}; cur = null; newChat(); } };
showView(S.last ? "chat" : "models");

// ---- context trimming, meter, input counter ----
function est(t) { return Math.ceil(String(t).length / 3.5); }
function buildMessages() {
  let file = fileCtx ? fileCtx.text : "";
  const head = () => S.sys + (fileCtx ? `\n\nThe user attached a file named "${fileCtx.name}":\n${file}` : "");
  const msgs = history.slice(); let trimmed = 0;
  const used = () => est(head()) + msgs.reduce((a, m) => a + est(m.content) + 4, 0) + S.max;
  if (S.trim && S.ctx > 0) {
    while (msgs.length > 1 && used() > S.ctx) { msgs.shift(); trimmed++; }
    while (msgs.length > 1 && msgs[0].role !== "user") { msgs.shift(); trimmed++; }
    if (file && used() > S.ctx) file = file.slice(0, Math.max(500, Math.floor(file.length - (used() - S.ctx) * 3.5)));
  }
  return { msgs: [{ role: "system", content: head() }, ...msgs], trimmed };
}
function updateMeter() {
  const { msgs } = buildMessages(), typed = input.value.trim();
  const used = msgs.reduce((a, m) => a + est(m.content) + 4, 0) + est(input.value);
  $("meter").textContent = `Typing: ${typed ? typed.split(/\s+/).length : 0} words, ~${est(input.value)} tokens · Conversation: ~${used} tokens${S.ctx > 0 ? " of " + S.ctx : " (no limit set)"}`;
  $("meterbar").style.display = S.ctx > 0 ? "" : "none";
  if (S.ctx > 0) $("meterbar").value = Math.min(1, (used + S.max) / S.ctx);
}
input.addEventListener("input", updateMeter);
bind("ctx", "ctx", true, updateMeter); bind("trim", "trim");
function syncChat() { if (cur && chats[cur]) { chats[cur].history = history; chats[cur].ts = Date.now(); saveChats(); } }

// ---- per-message actions ----
chat.addEventListener("click", e => {
  const b = e.target.closest(".acts button"); if (!b) return;
  const el = b.closest(".msg"), i = +el.dataset.i;
  if (b.dataset.a === "copy") {
    navigator.clipboard.writeText(history[i] ? history[i].content : el.querySelector(".mt").textContent);
    b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1200);
  } else if (b.dataset.a === "del" && !busy && history[i]) { history.splice(i, 1); renderAll(); syncChat(); }
});

// ---- chat search and rename ----
$("csearch").addEventListener("input", chatList);
$("rename").onclick = () => {
  if (!cur || !chats[cur]) { alert("Open a saved chat first."); return; }
  const t = prompt("Chat name:", chats[cur].title);
  if (t && t.trim()) { chats[cur].title = t.trim().slice(0, 60); saveChats(); chatList(); }
};

// ---- personas ----
const PERSONAS = {
  "Default": "You are a helpful, concise assistant.",
  "Coding helper": "You are an expert programmer. Give correct, minimal code with short explanations.",
  "Short answers": "Answer in one or two sentences unless asked for more.",
  "Explain simply": "Explain things simply, as if to a curious 10-year-old, using everyday examples.",
  "Writing editor": "You are a careful editor. Improve clarity and grammar while keeping the author's voice, and briefly say what you changed.",
  "Tutor": "You are a patient tutor. Ask guiding questions and check understanding instead of just giving answers."
};
const personas = () => ({ ...PERSONAS, ...S.personas });
function buildPersonas() {
  const all = personas();
  $("persona").innerHTML = '<option value="">Custom prompt</option>' + Object.keys(all).map(k => `<option>${esc(k)}</option>`).join("");
  $("persona").value = Object.keys(all).find(k => all[k] === S.sys) || "";
}
$("persona").onchange = () => { const v = personas()[$("persona").value]; if (v == null) return; S.sys = v; $("sys").value = v; saveS(); };
$("psave").onclick = () => { const n = prompt("Name for this preset:"); if (n && n.trim()) { S.personas[n.trim()] = S.sys; saveS(); buildPersonas(); } };
$("pdel").onclick = () => {
  const k = $("persona").value;
  if (!k || !S.personas[k]) { alert("Pick one of your own saved presets to delete."); return; }
  delete S.personas[k]; saveS(); buildPersonas();
};
$("sys").addEventListener("input", buildPersonas);

// ---- saved looks ----
const LOOK_KEYS = ["theme", "accent", "radius", "bubble", "fontfam", "density", "width", "font"];
function syncControls() {
  $("sys").value = S.sys; $("temp").value = S.temp; $("max").value = S.max; $("ctx").value = S.ctx; $("trim").checked = S.trim;
  $("font").value = S.font; $("radius").value = S.radius; $("width").value = S.width; $("fontfam").value = S.fontfam;
  $("density").value = S.density; $("bubble").value = S.bubble; $("auto").checked = S.auto; $("onlyfav").checked = S.onlyfav;
}
function buildLooks() { $("looksel").innerHTML = '<option value="">Saved looks...</option>' + Object.keys(S.looks).map(k => `<option>${esc(k)}</option>`).join(""); }
$("looksave").onclick = () => {
  const n = prompt("Name for this look:"); if (!n || !n.trim()) return;
  S.looks[n.trim()] = Object.fromEntries(LOOK_KEYS.map(k => [k, S[k]])); saveS(); buildLooks(); $("looksel").value = n.trim();
};
$("looksel").onchange = () => {
  const l = S.looks[$("looksel").value]; if (!l) return;
  Object.assign(S, l); saveS(); syncControls(); applyUI(); buildThemeGrid();
};
$("lookdel").onclick = () => { const k = $("looksel").value; if (k && S.looks[k]) { delete S.looks[k]; saveS(); buildLooks(); } };

// ---- backup and restore ----
$("backup").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "webllm-chat", version: 1, settings: S, chats }, null, 1)], { type: "application/json" }));
  a.download = "webllm-chat-backup.json"; a.click();
};
$("restore").onclick = () => $("restorefile").click();
$("restorefile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "webllm-chat" || !d.settings || !d.chats) throw new Error("This doesn't look like a backup from this page.");
    if (!confirm("Restore the settings and merge the chats from this backup?")) return;
    Object.assign(chats, d.chats); LS.set("wl_set", d.settings); LS.set("wl_chats", chats); location.reload();
  } catch (err) { alert("Couldn't restore: " + err.message); }
};

// ---- keyboard shortcuts ----
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!busy) { newChat(); showView("chat"); input.focus(); } }
  else if (e.key === "Escape" && busy && runner) runner.stop();
});

syncControls(); buildPersonas(); buildLooks();
window.__ready = true; updateMeter();
</script>
</body>
</html>
