<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebLLM Chat</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --card:#f3f3f1; --me:#2b5fd9; --line:#ddd; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --muted:#999; --card:#242424; --me:#3d6fe0; --line:#333; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; display:flex; flex-direction:column; max-width:760px; margin:0 auto; padding:12px; }
  header { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select,button,textarea { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; } button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--me); color:#fff; border-color:var(--me); }
  #status { color:var(--muted); font-size:13px; margin:8px 0; min-height:20px; }
  #bar { height:4px; background:var(--card); border-radius:2px; overflow:hidden; display:none; }
  #bar div { height:100%; width:0; background:var(--me); transition:width .2s; }
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; background:var(--card); }
  .msg.user { align-self:flex-end; background:var(--me); color:#fff; }
  form { display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:46px; }
  :root[data-theme="light"] { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --card:#f3f3f1; --line:#ddd; }
  :root[data-theme="dark"] { --bg:#161616; --fg:#eee; --muted:#999; --card:#242424; --line:#333; }
  .msg pre { position:relative; background:rgba(0,0,0,.25); padding:8px; border-radius:8px; overflow-x:auto; margin:6px 0; }
  .msg code { font-family:monospace; } .cp { position:absolute; top:4px; right:4px; font-size:12px; padding:2px 6px; }
  #settings label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:2px; }
  #settings input[type=checkbox] { width:auto; }
</style>
</head>
<body>
<header>
  <select id="model" style="max-width:100%">
    <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2-360M-Instruct-q4f16_1 (~0.4 GB)</option>
    <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5-0.5B-Instruct-q4f16_1 (~0.5 GB)</option>
    <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama-3.2-1B-Instruct-q4f16_1 (~0.9 GB)</option>
    <option value="Llama-3.2-3B-Instruct-q4f16_1-MLC">Llama-3.2-3B-Instruct-q4f16_1 (~2.3 GB)</option>
  </select>
  <button id="star" title="Favorite this model">☆</button>
  <button id="load" class="primary">Load model</button>
  <button id="clear">Clear chat</button>
</header>
<div id="filters" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
  <select id="sort"><option value="desc">Biggest to smallest</option><option value="asc">Smallest to biggest</option><option value="az">A to Z</option></select>
  <select id="fam"><option value="All">All families</option></select>
  <span id="count" style="color:var(--muted);font-size:13px"></span>
  <label style="font-size:13px;color:var(--muted)"><input type="checkbox" id="onlyfav"> ★ only</label>
</div>
<div id="chatbar" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
  <select id="chats" style="max-width:100%;flex:1;min-width:120px"></select>
  <button id="newchat">New</button><button id="delchat">Delete chat</button><button id="export">Export</button><button id="cache">Cache</button>
</div>
<div id="cachebox" style="display:none;margin-top:6px;font-size:13px;background:var(--card);border-radius:8px;padding:8px"></div>
<details id="settings" style="margin-top:8px">
  <summary style="cursor:pointer;color:var(--muted);font-size:13px">Settings</summary>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">
    <label style="grid-column:1/3">System prompt<textarea id="sys" style="height:70px;width:100%"></textarea></label>
    <label>Temperature (creativity)<input type="range" id="temp" min="0" max="1.5" step="0.1"></label>
    <label>Max reply tokens<input type="number" id="max" min="16" max="4096" style="font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px"></label>
    <label>Font size<input type="range" id="font" min="12" max="22"></label>
    <label>Theme<select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <label><span><input type="checkbox" id="auto"> Auto-load last model if cached</span></label>
  </div>
</details>
<div id="status">Pick a model and click Load. It downloads once, then is cached.</div>
<div id="bar"><div></div></div>
<div id="chat"></div>
<div id="fchip" style="display:none;cursor:pointer;color:var(--muted);font-size:13px"></div>
<div style="display:flex;gap:6px;margin:4px 0"><button id="regen">Regenerate</button><button id="edit">Edit last</button><button id="stop" style="display:none">Stop</button></div>
<form id="form">
  <button id="attach" type="button" title="Attach a text file">📎</button>
  <textarea id="input" placeholder="Load a model first..." disabled></textarea>
  <button id="send" class="primary" disabled>Send</button>
</form>
<input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.js,.py,.html,.css,.log,.xml,.yml,.yaml,text/*">

<script type="module">

const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), send = $("send"), status = $("status");
const bar = $("bar"), barFill = bar.firstElementChild;
let engine = null, busy = false;
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const S = Object.assign({ sys: "You are a helpful, concise assistant.", temp: 0.7, max: 1024, font: 15, theme: "auto", auto: false, last: "", favs: [], onlyfav: false }, LS.get("wl_set", {}));
const saveS = () => LS.set("wl_set", S);
let history = [];


let CreateMLCEngine, prebuiltAppConfig, hasModelInCache, deleteModelAllInfoInCache;
for (const url of ["https://esm.run/@mlc-ai/web-llm", "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm", "https://esm.sh/@mlc-ai/web-llm", "https://unpkg.com/@mlc-ai/web-llm?module", "https://cdn.skypack.dev/@mlc-ai/web-llm"]) {
  try { ({ CreateMLCEngine, prebuiltAppConfig, hasModelInCache, deleteModelAllInfoInCache } = await import(url)); break; }
  catch (e) { console.error("Library load failed:", url, e); }
}
if (!CreateMLCEngine) {
  status.textContent = /^https?:$/.test(location.protocol)
    ? "Couldn't load the WebLLM library (offline, or esm.run / jsdelivr is blocked by an extension or network)."
    : "This page was opened from a local file (" + location.protocol + "), and the browser blocks the library from loading there. Host the file at an https:// address (GitHub Pages or Netlify Drop) and open it from there.";
  $("load").disabled = true;
}

const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function md(t) {
  let h = esc(t);
  h = h.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, l, c) => `<pre><button class="cp" type="button">Copy</button><code>${c}</code></pre>`);
  return h.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function setMsg(d, text) { d.innerHTML = md(text); }
function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  setMsg(d, text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
chat.addEventListener("click", e => {
  if (!e.target.classList.contains("cp")) return;
  navigator.clipboard.writeText(e.target.nextElementSibling.textContent);
  e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1200);
});

// ---- Model list: built-ins + experimental extras, with sort and family filter ----
const FAMILIES = [
  ["TinyLlama", ["tinyllama"]], ["DeepSeek", ["deepseek"]], ["Hermes", ["hermes"]],
  ["Qwen", ["qwen"]], ["Llama", ["llama"]], ["Gemma", ["gemma"]], ["Phi", ["phi-", "phi3", "phi_"]],
  ["SmolLM", ["smollm"]], ["Mistral", ["mistral", "ministral"]], ["StableLM", ["stablelm"]]
];
const familyOf = id => {
  const s = id.toLowerCase();
  for (const [name, keys] of FAMILIES) if (keys.some(k => s.includes(k))) return name;
  return "Other";
};
const paramsOf = (id, vram) => {
  const m = id.match(/(?<![\d.])(\d+(?:\.\d+)?)\s*([BM])(?![a-zA-Z])/i);
  if (m) return parseFloat(m[1]) * (m[2].toUpperCase() === "B" ? 1 : 0.001);
  return (vram || 0) / 600; // rough guess when the name has no size
};
const fmtParams = p => p >= 1 ? (Number.isInteger(p) ? p : p.toFixed(1)) + "B" : Math.round(p * 1000) + "M";

const base = (prebuiltAppConfig ? prebuiltAppConfig.model_list : [])
  .filter(m => m.model_type !== 1) // 1 = embedding models, which can't chat
  .sort((a, b) => (a.vram_required_MB || 0) - (b.vram_required_MB || 0));
const all = base.map(m => ({
  id: m.model_id, family: familyOf(m.model_id), vram: m.vram_required_MB || 0,
  params: paramsOf(m.model_id, m.vram_required_MB), vision: m.model_type === 2, extra: false
}));

// Extra models that aren't in WebLLM's built-in list. These are guesses: each reuses the engine
// file of a similar built-in model (or its own), and many will fail to load. They're tagged [experimental].
const EXTRAS = [
  { id: "Qwen2-0.5B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-0.5B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-0.5B-Instruct-q4f16_1"] },
  { id: "Qwen2-1.5B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-1.5B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-1.5B-Instruct-q4f16_1"] },
  { id: "Qwen2-7B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2-7B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-7B-Instruct-q4f16_1"] },
  { id: "Qwen2.5-14B-Instruct-q4f16_1-MLC", repo: "mlc-ai/Qwen2.5-14B-Instruct-q4f16_1-MLC", tpl: ["Qwen2.5-7B-Instruct-q4f16_1"] },
  { id: "Qwen3.5-0.8B-q4f16_1-MLC", repo: "emb1ter/Qwen3.5-0.8B-q4f16_1-MLC", tpl: ["Qwen3-0.6B-q4f16_1"] },
  { id: "Qwen3.5-4B-q4f16_1-ctx8k_cs1k-MLC", repo: "emb1ter/Qwen3.5-4B-q4f16_1-ctx8k_cs1k-MLC", tpl: ["Qwen3-4B-q4f16_1"] },
  { id: "Qwen3.5-27B-q4f16_1-MLC", repo: "emb1ter/Qwen3.5-27B-q4f16_1-MLC", tpl: ["Qwen3-8B-q4f16_1"] },
  { id: "CodeLlama-7b-Instruct-hf-q4f16_1-MLC", repo: "mlc-ai/CodeLlama-7b-Instruct-hf-q4f16_1-MLC", tpl: ["Llama-2-7b-chat-hf-q4f16_1", "Llama-3.1-8B-Instruct-q4f16_1"] },
  { id: "CodeLlama-13b-Instruct-hf-q4f16_1-MLC", repo: "mlc-ai/CodeLlama-13b-Instruct-hf-q4f16_1-MLC", tpl: ["Llama-2-13b-chat-hf-q4f16_1", "Llama-3.1-8B-Instruct-q4f16_1"] },
  { id: "gemma-2-27b-it-q4f16_1-MLC", repo: "mlc-ai/gemma-2-27b-it-q4f16_1-MLC", tpl: ["gemma-2-9b-it-q4f16_1"] },
  { id: "EuroLLM-9B-Instruct-2512-q4f16_1-MLC", repo: "dstefl/EuroLLM-9B-Instruct-2512-q4f16_1-MLC",
    lib: "https://huggingface.co/dstefl/EuroLLM-9B-Instruct-2512-q4f16_1-MLC/resolve/main/EuroLLM-9B-Instruct-2512-q4f16_1-MLC-webgpu.wasm" }
];
function addExtra(x, tplModel) {
  const vram = Math.round(paramsOf(x.id) * 600 + 500);
  prebuiltAppConfig.model_list.push({
    model: "https://huggingface.co/" + x.repo, model_id: x.id,
    model_lib: x.lib || tplModel.model_lib, vram_required_MB: vram,
    low_resource_required: false, overrides: tplModel ? tplModel.overrides : undefined
  });
  all.push({ id: x.id, family: familyOf(x.id), vram, params: paramsOf(x.id, vram), vision: false, extra: true });
}
for (const x of (prebuiltAppConfig ? EXTRAS : [])) {
  if (all.some(e => e.id === x.id)) continue; // already built in
  let t = null;
  for (const k of x.tpl || []) { t = base.find(m => m.model_id.includes(k)); if (t) break; }
  if (t || x.lib) addExtra(x, t);
}

function buildFamilies() {
  const prev = $("fam").value || "All", counts = {};
  all.forEach(e => counts[e.family] = (counts[e.family] || 0) + 1);
  $("fam").innerHTML = `<option value="All">All families (${all.length})</option>` +
    Object.keys(counts).sort().map(f => `<option value="${f}">${f} (${counts[f]})</option>`).join("");
  $("fam").value = counts[prev] ? prev : "All";
}
function render(keep) {
  const prev = keep || $("model").value, fam = $("fam").value, order = $("sort").value;
  const list = all.filter(e => (fam === "All" || e.family === fam) && (!S.onlyfav || S.favs.includes(e.id)));
  list.sort((a, b) => order === "az" ? a.id.localeCompare(b.id)
    : (order === "asc" ? a.params - b.params : b.params - a.params) || a.id.localeCompare(b.id));
  $("model").innerHTML = "";
  for (const e of list) {
    const o = document.createElement("option");
    o.value = e.id;
    o.textContent = `${S.favs.includes(e.id) ? "★ " : ""}${e.id.replace("-MLC", "")} (~${fmtParams(e.params)}, ~${(e.vram / 1024).toFixed(1)} GB)` +
      (e.extra ? " [experimental]" : "") + (e.vision ? " [vision, text chat only here]" : "");
    $("model").appendChild(o);
  }
  if (list.some(e => e.id === prev)) $("model").value = prev;
  $("count").textContent = list.length + " models";
  $("star").textContent = S.favs.includes($("model").value) ? "★" : "☆";
}
if (all.length) {
  buildFamilies();
  $("sort").onchange = $("fam").onchange = () => render();
  render("SmolLM2-360M-Instruct-q4f16_1-MLC");
} else {
  $("filters").style.display = "none";
}


if (CreateMLCEngine && !navigator.gpu) {
  status.textContent = "WebGPU isn't available in this browser. Try recent Chrome or Edge.";
  $("load").disabled = true;
}
const CFG = () => ({ ...prebuiltAppConfig, useIndexedDBCache: true });

// ---- settings ----
const applyUI = () => { document.documentElement.dataset.theme = S.theme; document.body.style.fontSize = S.font + "px"; };
$("sys").value = S.sys; $("temp").value = S.temp; $("max").value = S.max; $("font").value = S.font;
$("theme").value = S.theme; $("auto").checked = S.auto; $("onlyfav").checked = S.onlyfav;
const bind = (id, key, num, after) => $(id).addEventListener("input", () => {
  const el = $(id);
  S[key] = el.type === "checkbox" ? el.checked : num ? (parseFloat(el.value) || 0) : el.value;
  saveS(); if (after) after();
});
bind("sys", "sys"); bind("temp", "temp", true); bind("max", "max", true); bind("font", "font", true, applyUI);
bind("theme", "theme", false, applyUI); bind("auto", "auto");
applyUI();
$("onlyfav").onchange = () => { S.onlyfav = $("onlyfav").checked; saveS(); if (all.length) render(); };
$("star").onclick = () => {
  const id = $("model").value, i = S.favs.indexOf(id);
  if (i < 0) S.favs.push(id); else S.favs.splice(i, 1);
  saveS(); if (all.length) render(id);
};
$("model").onchange = () => { $("star").textContent = S.favs.includes($("model").value) ? "★" : "☆"; };
if (S.last && all.some(e => e.id === S.last)) { $("model").value = S.last; $("model").onchange(); }

// ---- saved chats ----
let chats = LS.get("wl_chats", {}), cur = LS.get("wl_cur", null);
const saveChats = () => { LS.set("wl_chats", chats); LS.set("wl_cur", cur); };
function chatList() {
  $("chats").innerHTML = '<option value="">New chat</option>' + Object.entries(chats).sort((a, b) => b[1].ts - a[1].ts)
    .map(([id, c]) => `<option value="${id}">${esc(c.title)}</option>`).join("");
  $("chats").value = cur && chats[cur] ? cur : "";
}
function renderAll() { chat.innerHTML = ""; history.forEach(m => addMsg(m.role, m.content)); }
function persist() {
  if (!history.length) return;
  if (!cur || !chats[cur]) { cur = "c" + Date.now(); chats[cur] = { title: history[0].content.slice(0, 40) }; }
  chats[cur].history = history; chats[cur].ts = Date.now(); saveChats(); chatList();
}
function newChat() { cur = null; history = []; renderAll(); chatList(); saveChats(); }
if (cur && chats[cur]) history = chats[cur].history.slice(); else cur = null;
renderAll(); chatList();
$("chats").onchange = () => { cur = $("chats").value || null; history = cur ? chats[cur].history.slice() : []; renderAll(); saveChats(); };
$("newchat").onclick = newChat;
$("delchat").onclick = () => { if (cur && chats[cur]) delete chats[cur]; newChat(); };
$("clear").onclick = async () => { newChat(); if (engine) await engine.resetChat(); };
$("export").onclick = () => {
  if (!history.length) return;
  const t = history.map(m => `**${m.role === "user" ? "You" : "AI"}:**\n${m.content}`).join("\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([t], { type: "text/markdown" })); a.download = "chat.md"; a.click();
};

// ---- cache manager ----
if (!hasModelInCache) $("cache").style.display = "none";
$("cache").onclick = async () => {
  const box = $("cachebox");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.style.display = "block"; box.textContent = "Checking downloaded models...";
  const rows = [];
  await Promise.all(all.map(async e => { try { if (await hasModelInCache(e.id, CFG())) rows.push(e); } catch {} }));
  box.innerHTML = rows.length ? "" : "No models downloaded yet.";
  rows.sort((a, b) => a.params - b.params).forEach(e => {
    const r = document.createElement("div");
    r.style.cssText = "display:flex;justify-content:space-between;gap:8px;padding:4px 0";
    r.innerHTML = `<span>${esc(e.id)} (~${(e.vram / 1024).toFixed(1)} GB)</span>`;
    const b = document.createElement("button"); b.textContent = "Delete";
    b.onclick = async () => { await deleteModelAllInfoInCache(e.id, CFG()); r.remove(); };
    r.appendChild(b); box.appendChild(r);
  });
  if (navigator.storage && navigator.storage.estimate) {
    const { usage, quota } = await navigator.storage.estimate();
    const f = document.createElement("div"); f.style.color = "var(--muted)";
    f.textContent = `Storage used by this site: ${(usage / 1e9).toFixed(2)} GB of about ${(quota / 1e9).toFixed(0)} GB`;
    box.appendChild(f);
  }
};

// ---- loading a model ----
$("load").onclick = async () => {
  const id = $("model").value, info = all.find(e => e.id === id), mem = navigator.deviceMemory;
  if (info && mem && info.vram / 1024 > mem * 0.4 &&
      !confirm(`${id} needs about ${(info.vram / 1024).toFixed(1)} GB and this device reports ${mem} GB of RAM. It may crash or fail. Load anyway?`)) return;
  $("load").disabled = true; $("model").disabled = true;
  bar.style.display = "block";
  try {
    engine = await CreateMLCEngine(id, {
      appConfig: CFG(),
      initProgressCallback: p => { status.textContent = p.text; barFill.style.width = Math.round((p.progress || 0) * 100) + "%"; }
    });
    S.last = id; saveS();
    status.textContent = "Ready. Everything runs on your device.";
    input.disabled = false; send.disabled = false;
    input.placeholder = "Type a message (Enter to send)";
    input.focus();
  } catch (e) {
    console.error(e);
    status.textContent = "Failed to load: " + (e.message || e.name || String(e));
    $("load").disabled = false; $("model").disabled = false;
  }
  bar.style.display = "none";
};
if (S.auto && S.last && hasModelInCache && all.some(e => e.id === S.last)) {
  hasModelInCache(S.last, CFG()).then(ok => { if (ok) $("load").click(); }).catch(() => {});
}

// ---- chatting ----
let fileCtx = null;
async function generate() {
  busy = true; send.disabled = true; $("stop").style.display = "inline-block";
  const out = addMsg("assistant", "…");
  let reply = "", n = 0; const t0 = performance.now();
  const sys = S.sys + (fileCtx ? `\n\nThe user attached a file named "${fileCtx.name}":\n${fileCtx.text}` : "");
  try {
    const stream = await engine.chat.completions.create({
      messages: [{ role: "system", content: sys }, ...history], stream: true, temperature: S.temp, max_tokens: S.max
    });
    for await (const c of stream) {
      const d = c.choices[0]?.delta?.content || "";
      if (d) { reply += d; n++; setMsg(out, reply); chat.scrollTop = chat.scrollHeight; }
    }
    history.push({ role: "assistant", content: reply || "(stopped)" });
    status.textContent = `${(n / ((performance.now() - t0) / 1000)).toFixed(1)} tokens/s`;
  } catch (e) { setMsg(out, "Error: " + e.message); }
  busy = false; send.disabled = false; $("stop").style.display = "none"; persist(); input.focus();
}
async function ask() {
  const text = input.value.trim();
  if (!text || !engine || busy) return;
  input.value = ""; history.push({ role: "user", content: text }); addMsg("user", text);
  await generate();
}
$("form").onsubmit = e => { e.preventDefault(); ask(); };
input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } };
$("stop").onclick = () => { if (engine) engine.interruptGenerate(); };
$("regen").onclick = async () => {
  if (busy || !engine || !history.length) return;
  if (history.at(-1).role === "assistant") history.pop();
  renderAll(); await generate();
};
$("edit").onclick = () => {
  if (busy) return;
  while (history.length && history.at(-1).role === "assistant") history.pop();
  const u = history.pop(); if (u) input.value = u.content;
  renderAll(); if (cur && chats[cur]) { chats[cur].history = history; saveChats(); }
  input.focus();
};

// ---- file attach ----
$("attach").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = (await f.text()).slice(0, 12000);
  fileCtx = { name: f.name, text };
  $("fchip").textContent = `📎 ${f.name} (first ${text.length} characters). Click to remove.`;
  $("fchip").style.display = "block"; e.target.value = "";
};
$("fchip").onclick = () => { fileCtx = null; $("fchip").style.display = "none"; };
</script>
</body>
</html>
